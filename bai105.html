<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Định dạng văn bản</title>
</head>

<body>

    <h2 align="center">
        <font color="green">Định dạng văn bản</font>
    </h2>

    <p>
        <b><u>Hóa học:</u></b>
        <i>
            Nước:
            <font color="#FF0000">
                H<sub>2</sub>O
            </font>;
            Axit Sunfuric:
            <font color="#FF0000">
                H<sub>2</sub>SO<sub>4</sub>
            </font>
        </i>
    </p>

    <p>
        <b><u>Toán học:</u></b>
        <i>
            Phương trình bậc 2:
            <font color="#FF0000">
                ax<sup>2</sup> + bx + c = 0
            </font>
        </i>
    </p>

    <p>
        <b><u>Tin học:</u></b>
        <i>Vòng lặp For:</i>
    </p>

    <pre style="background-color:#CCCCCC; color:#0000CC;">
        For i = 0 To 10

                Tong = Tong + i

        Next
    </pre>

</body>
</html>
